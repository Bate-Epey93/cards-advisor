<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cards Advisor</title>
<meta name="description" content="Study tool for bank cards advisors: the six steps of a call, common card issues, what the client needs, the policy behind each figure, practice calls and flashcards. Not affiliated with any bank.">
<meta name="theme-color" content="#070913">
<script>try{var t=((JSON.parse(localStorage.getItem('cards-advisor:v1')||'{}').prefs||{}).theme==='light')?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='light'?'#f5f2eb':'#070913';}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cards Advisor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/call.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div id="app" class="app-shell">
  <header class="topbar" id="topbar">
    <div class="tb-left">
      <button class="tb-btn tb-back" id="backBtn" aria-label="Back to issues" title="Back to issues (Esc)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="tb-back-lbl">Issues</span>
      </button>
      <a class="brand" href="#/call" id="brandHome" title="Home">
        <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name">Cards Advisor</span>
        </span>
      </a>
    </div>

    <nav class="tb-nav" id="tbNav" aria-label="Primary navigation">
      <a class="tb-tab" href="#/call" data-nav="call">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 9V8a5 5 0 0110 0v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><rect x="2" y="8.5" width="3" height="4.5" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="8.5" width="3" height="4.5" rx="1.2" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>Call</span>
      </a>
      <a class="tb-tab" href="#/" data-nav="issues">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>Issues</span>
      </a>
      <a class="tb-tab" href="#/practice" data-nav="practice">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11z" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 6l4 2-4 2V6z" fill="currentColor"/></svg>
        <span>Practice</span>
      </a>
      <a class="tb-tab" href="#/policy" data-nav="policy">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2.5h8A1.5 1.5 0 0113.5 4v8a1.5 1.5 0 01-1.5 1.5H4A1.5 1.5 0 012.5 12V4A1.5 1.5 0 014 2.5z" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 6h5M5.5 8.5h5M5.5 11h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Policy</span>
      </a>
      <a class="tb-tab" href="#/me" data-nav="me">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="5.6" r="2.6" stroke="currentColor" stroke-width="1.4"/><path d="M2.8 13.5a5.2 5.2 0 0110.4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Me</span>
      </a>
    </nav>

    <div class="tb-right">
      <div class="reader-ctrls" id="readerCtrls">
        <button class="tb-btn tb-pol-btn" id="topPolicyBtn" type="button" title="Policy for this issue" aria-label="Policy for this issue">
          <span>Policy</span>
        </button>
      </div>

      <button class="tb-icon-btn" id="searchBtn" aria-label="Search" title="Search (/ or ⌘K)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>

      <button class="tb-icon-btn" id="themeBtn" aria-label="Light or dark theme" title="Light or dark theme">
        <svg class="ico-sun" width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg class="ico-moon" width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M13.2 10.2A5.8 5.8 0 015.8 2.8a5.8 5.8 0 107.4 7.4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>

      <a class="tb-icon-btn" href="#/about" id="aboutBtn" aria-label="Settings" title="Settings">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="8" r="4.4" stroke="currentColor" stroke-width="1.4"/></svg>
      </a>

      <button class="btn sm pri" id="installBtn" hidden>Install</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="screen screen-active">
      <div class="screen-inner"><p class="dim">Loading…</p></div>
    </section>
  </main>
</div>

<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Search">
  <div class="palette-box">
    <div class="palette-head">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="palette-ico"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="paletteInput" type="search" aria-label="Search" role="combobox" aria-controls="paletteResults" aria-expanded="true" aria-autocomplete="list" placeholder="Search issues, call steps, policy" autocomplete="off" spellcheck="false">
      <kbd class="kbd">ESC</kbd>
      <button type="button" class="palette-close" id="paletteClose" aria-label="Close search">Close</button>
    </div>
    <div class="palette-results" id="paletteResults" role="listbox" aria-label="Results"></div>
    <div class="palette-hint">
      <span><kbd class="kbd">↑</kbd> <kbd class="kbd">↓</kbd> to navigate</span>
      <span><kbd class="kbd">↵</kbd> to open</span>
      <span><kbd class="kbd">/</kbd> or <kbd class="kbd">⌘K</kbd> anytime</span>
    </div>
  </div>
</div>

<script src="vendor/rough.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
